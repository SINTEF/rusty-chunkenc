[package]
name = "rusty-chunkenc"
version = "0.1.2"
edition = "2021"
description = "A Rust implementation of Prometheus' chunkenc library"
license = "Apache-2.0"
keywords = ["prometheus", "chunkenc", "encoding", "time-series", "gorilla"]
documentation = "https://docs.rs/rusty-chunkenc"
authors = ["Antoine Pultier <antoine.pultier@sintef.no>"]
repository = "https://github.com/sintef/rusty-chunkenc"
include = [
  "README.md",
  "LICENSE",
  "src/*.rs",
  "src/**/*.rs",
  "Cargo.toml",
  "Cargo.lock",
]

[dependencies]
nom = "8.0"
crc32c = "0.6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
thiserror = "2.0"
bitstream-io = "4.5"
smallvec = { version = "2.0.0-alpha.11", features = ["std"] }

[dev-dependencies]
base64 = "0.22"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
